server {
    listen 80;

    # Serve the SPA shell and microfrontend assets
    location /openmrs/spa/ {
        root /usr/share/nginx/html;
        # Fall back to index.html for client-side routing
        try_files $uri /openmrs/spa/index.html;
    }

    # Proxy all other OpenMRS requests (REST, FHIR, login, etc.) to the backend
    location /openmrs/ {
        proxy_pass http://backend:8080/openmrs/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Increase buffer sizes for large FHIR payloads
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
    }
}
